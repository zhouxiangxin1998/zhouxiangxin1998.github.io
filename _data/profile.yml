short_bio_text_justify: false
short_bio: >-
  <p>
    I am a fourth-year Ph.D. student at University of Chinese Academy of Sciences (UCAS) and Institute of Automation, Chinese Academy of Sciences (CASIA), 
    advisded by <a href="https://scholar.google.com/citations?user=8kzzUboAAAAJ" target="_blank">Liang Wang</a>.
  </p>
  <p>
    Previously, I received my B.Eng. degree from Tsinghua University in 2021.
  <p>
    My research focuses on reinforcement learning for enhancing large language models (LLMs), improving their reasoning abilities and making their responses more accurate, reliable, trustworthy, and interpretable.
    I also study long-term memory for LLMs, aiming to enable LLMs to personalize their behavior through continual interactions with users.
  </p>
    In addition, I work on AI for Drug Discovery (AIDD), developing advanced generative models and algorithms for designing small molecules and proteins.
  </p>

